<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP AP Generator - UPTD Puskesmas Jambesari</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="brand">
            <i class="fa-solid fa-notes-medical"></i>
            <div>
                <span class="brand-title">SOP AP Builder Pro</span>
                <span class="brand-sub">PermenPANRB No. 35/2012 — UPTD Puskesmas Jambesari</span>
            </div>
        </div>
        <div class="user-info">
            <span class="badge"><i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Mode Aktif: User Builder</span>
        </div>
    </header>

    <main class="main-container">
        
        <aside class="sidebar no-print">
            <div class="card">
                <div class="card-header"><i class="fa-solid fa-building-columns"></i> Identitas Instansi (Statis)</div>
                <div class="card-body">
                    <div class="form-group"><label>Pemerintah Daerah</label><input type="text" id="cfgPemda" value="PEMERINTAH KABUPATEN BONDOWOSO" oninput="updatePreview()"></div>
                    <div class="form-group"><label>Dinas Kesehatan</label><input type="text" id="cfgDinas" value="DINAS KESEHATAN KABUPATEN BONDOWOSO" oninput="updatePreview()"></div>
                    <div class="form-group"><label>Nama Puskesmas</label><input type="text" id="cfgPuskesmas" value="UPTD PUSKESMAS JAMBESARI" oninput="updatePreview()"></div>
                    <div class="form-group"><label>Nama Kepala Puskesmas</label><input type="text" id="cfgKaPuskesmas" value="drg.Noeri Rustianti" oninput="updatePreview()"></div>
                    <div class="form-group"><label>NIP Kepala Puskesmas</label><input type="text" id="cfgNipKa" value="19761018 200604 2 015" oninput="updatePreview()"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fa-solid fa-pen-to-square"></i> Konten SOP (Dinamis)</div>
                <div class="card-body">
                    <div class="form-group"><label>Judul SOP</label><input type="text" id="inpJudul" value="Pendaftaran Pasien Rawat Inap" oninput="updatePreview()"></div>
                    
                    <div class="form-row">
                        <div class="form-group"><label>Nomor Urut SOP</label><input type="text" id="inpNoSOP" value="001" oninput="updatePreview()"></div>
                        <div class="form-group"><label>Tahun</label><input type="text" id="inpTahun" value="2026" oninput="updatePreview()"></div>
                    </div>

                    <div class="form-row">
                        <div class="form-group"><label>Tanggal Pembuatan</label><input type="date" id="inpTglBuat" value="2026-10-01" oninput="updatePreview()"></div>
                        <div class="form-group"><label>Tanggal Revisi</label><input type="date" id="inpTglRevisi" value="" oninput="updatePreview()"></div>
                    </div>

                    <div class="form-group"><label>Tanggal Efektif</label><input type="date" id="inpTglEfektif" value="2026-10-05" oninput="updatePreview()"></div>

                    <div class="form-group"><label>Orientasi Halaman Cetak</label>
                        <select id="inpOrientasi" onchange="updatePreview()">
                            <option value="landscape" selected>Landscape A4 (Standar SOP AP)</option>
                            <option value="portrait">Portrait A4</option>
                        </select>
                    </div>

                    <hr class="divider">
                    <label class="section-label">1. Dasar Hukum (Regulasi Terbaru)</label>
                    <div class="tag-list" id="listDasarHukum"></div>
                    <div class="inline-add"><input type="text" id="inpDasarHukum" placeholder="Undang-Undang / Permenkes"><button class="btn btn-sm btn-primary" onclick="addDasarHukum()"><i class="fa-solid fa-plus"></i></button></div>

                    <hr class="divider">
                    <label class="section-label">2. Keterkaitan</label>
                    <div class="tag-list" id="listKeterkaitan"></div>
                    <div class="inline-add"><input type="text" id="inpKeterkaitan" placeholder="SOP lain yang terkait"><button class="btn btn-sm btn-primary" onclick="addKeterkaitan()"><i class="fa-solid fa-plus"></i></button></div>

                    <hr class="divider">
                    <div class="form-group"><label>3. Peringatan</label><textarea id="inpPeringatan" rows="2" oninput="updatePreview()">Apabila prosedur tidak dilakukan dengan teliti, maka pelayanan rawat inap terhambat.</textarea></div>
                    
                    <div class="form-group"><label>4. Kualifikasi Pelaksana</label><textarea id="inpKualifikasi" rows="2" oninput="updatePreview()">1. Memiliki kemampuan komunikasi yang baik&#10;2. Menguasai sistem pelayanan pendaftaran</textarea></div>

                    <div class="form-group"><label>5. Peralatan dan Perlengkapan</label><textarea id="inpPeralatan" rows="2" oninput="updatePreview()">1. Komputer & Printer&#10;2. Berkas Rekam Medis</textarea></div>

                    <div class="form-group"><label>6. Pencatatan dan Pendataan</label><textarea id="InpPencatatan" rows="2" oninput="updatePreview()">Dicatat dalam buku register dan diinput ke dalam database SIMPUS.</textarea></div>

                    <hr class="divider">
                    <label class="section-label">7. Pelaksana / Subjek Terlibat (Aktor Internal)</label>
                    <div class="tag-list" id="listPelaksana"></div>
                    <div class="inline-add"><input type="text" id="inpNamaPelaksana" placeholder="Nama Pelaksana / Staf"><button class="btn btn-sm btn-primary" onclick="addPelaksana()"><i class="fa-solid fa-plus"></i></button></div>

                    <hr class="divider">
                    <label class="section-label">8. Langkah-Langkah & Bagan Alir (Flowchart)</label>
                    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                        <button class="btn btn-sm btn-primary" style="flex: 2;" onclick="addStepRow()"><i class="fa-solid fa-plus-circle"></i> Tambah Langkah</button>
                        <button class="btn btn-sm btn-danger" style="flex: 1;" onclick="clearSteps()"><i class="fa-solid fa-trash-can"></i> Bersihkan</button>
                    </div>
                    <div id="stepsBuilderContainer"></div>

                    <button class="btn btn-success" onclick="window.print()"><i class="fa-solid fa-print"></i> Cetak / Ekspor PDF A4</button>
                </div>
            </div>
        </aside>

        <!-- CONTAINER MULTI HALAMAN PREVIEW A4 -->
        <section class="preview-area" id="previewAreaContainer">
            <!-- Halaman A4 dirender secara dinamis -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
